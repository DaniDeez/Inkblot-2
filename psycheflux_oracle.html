            face_identity: { message: "Persona, identity, what is shown.", triggers: ["face", "eyes", "look", "expression"] },
            profile: { message: "Perspective, side of self, incomplete view.", triggers: ["profile", "side", "face"] },
            mask_identity: { message: "False self, protection, hidden emotion.", triggers: ["mask", "cover", "pretend", "hide"] },
            clown: { message: "Performance, hidden pain, emotional exaggeration.", triggers: ["clown", "jester", "smile", "fake"] },
            witch: { message: "Powerful feminine, feared knowledge, archetypal outsider.", triggers: ["witch", "magic", "crone", "hag"] },
            angel: { message: "Purity, divine messenger, protection.", triggers: ["angel", "wing", "halo", "light"] },
            demon: { message: "Temptation, inner shadow, power misused.", triggers: ["demon", "dark", "devil", "horn"] },
            skull: { message: "Mortality, truth beneath appearance.", triggers: ["skull", "bone", "death", "head"] },
            skeleton: { message: "Hidden truths, vulnerability, old structure.", triggers: ["skeleton", "bones", "rattle", "truth"] },
            woman: { message: "Feminine essence, reflection, archetypal anima.", triggers: ["woman", "she", "feminine"] },
            man: { message: "Masculine presence, archetypal animus.", triggers: ["man", "he", "masculine"] },
            child: { message: "Innocence, vulnerability, beginning.", triggers: ["child", "young", "baby", "small"] },
            twin_figures: { message: "Duality, mirror self, choice.", triggers: ["twin", "two", "mirror", "reflection"] },
            person_in_costume: { message: "Role-playing, hidden motives, performance self.", triggers: ["costume", "dress-up", "disguise", "play"] },

            // Additional Objects
            lamp: { message: "Guidance, insight, inner light.", triggers: ["lamp", "light", "glow", "shine"] },
            chandelier: { message: "Elegance, radiance, spiritual vision.", triggers: ["chandelier", "light", "crystal", "hang"] },
            fountain: { message: "Flow of emotion, cleansing, abundance.", triggers: ["fountain", "water", "spray", "flow"] },
            ornament: { message: "Adornment, ego, beauty or distraction.", triggers: ["ornament", "decoration", "sparkle", "glitter"] },
            building: { message: "Structure of self, life foundation, stability.", triggers: ["building", "house", "structure", "architecture"] },
            tower: { message: "Ambition, isolation, downfall or elevation.", triggers: ["tower", "high", "fall", "collapse"] },
            bridge_object: { message: "Connection, transition, overcoming division.", triggers: ["bridge", "cross", "connect", "between"] }
        };

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('oracle-container');
            canvas.style('position', 'absolute');
            canvas.style('top', '0');
            canvas.style('left', '0');
            canvas.style('z-index', '1');

            colorMode(HSB, 360, 100, 100, 100);

            // Initialize inkblot particles - fewer, much larger blobs
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: random(-400, 400),
                    y: random(-400, 400),
                    vx: random(-2, 2),
                    vy: random(-2, 2),
                    size: random(80, 140),
                    noiseOffset: random(10000),
                    noiseScale: random(0.005, 0.02),
                    life: random(0.7, 1)
                });
            }

            console.log('Psycheflux Oracle initialized');
        }

        function draw() {
            if (phase === 1) {
                drawPhase1();
            } else if (phase === 2) {
                drawPhase2();
            }
        }

        function drawPhase1() {
            // Breathing background - darker for contrast
            breathingPhase += 1;
            let breathBrightness = map(sin(TWO_PI * breathingPhase / breathingCycle), -1, 1, 5, 15);
            background(0, 0, breathBrightness);

            // Transition through colors faster
            currentHue = (currentHue + 2.0) % 360;

            // Apply optimized gaussian blur filter for performance
            drawingContext.filter = 'blur(15px)';

            // Create symmetrical inkblot using flow field
            push();
            translate(width / 2, height / 2);

            // Use blend mode for blob effect
            blendMode(ADD);

            // Left side (generative)
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];

                // Flow field using Perlin noise with varied scales for organic shapes
                let angle = noise(p.x * p.noiseScale, p.y * p.noiseScale, p.noiseOffset) * TWO_PI * 3;
                let force = noise(p.x * p.noiseScale * 2, p.y * p.noiseScale * 2, p.noiseOffset + 100) * 3.5;

                p.vx += cos(angle) * force;
                p.vy += sin(angle) * force;

                // Less damping for faster, more energetic movement
                p.vx *= 0.90;
                p.vy *= 0.90;

                // Update position
                p.x += p.vx;
                p.y += p.vy;

                // Attraction to center with larger bounds
                let distToCenter = dist(p.x, p.y, 0, 0);
                if (distToCenter > 400) {
                    p.vx -= p.x * 0.001;
                    p.vy -= p.y * 0.001;
                }

                // Unified color with slight variations for depth
                let hueVariation = sin(p.noiseOffset + frameCount * 0.02) * 20;
                let particleHue = (currentHue + hueVariation) % 360;

                // Optimized glow and gaussian blur for performance
                drawingContext.shadowBlur = 100;
                drawingContext.shadowColor = `hsl(${particleHue}, 100%, 70%)`;

                fill(particleHue, 100, 100, 50);
                noStroke();

                // Draw organic blob shapes with blur
                ellipse(p.x, p.y, p.size * p.life);

                // Mirrored right side
                fill(particleHue, 100, 100, 45);
                ellipse(-p.x, p.y, p.size * p.life * 0.95);

                // Update life and reset if needed
                p.life -= 0.001;
                if (p.life <= 0.3) {
                    p.x = random(-400, 400);
                    p.y = random(-400, 400);
                    p.vx = random(-2, 2);
                    p.vy = random(-2, 2);
                    p.life = random(0.7, 1);
                    p.noiseScale = random(0.005, 0.02);
                }

                p.noiseOffset += 0.08;
            }

            pop();

            // Reset blend mode, shadow, and filter
            blendMode(BLEND);
            drawingContext.shadowBlur = 0;
            drawingContext.filter = 'none';
        }

        function drawPhase2() {
            // Display frozen canvas
            if (frozenCanvas) {
                image(frozenCanvas, 0, 0);
            }
        }

        function mousePressed() {
            if (phase === 1 && !isFrozen) {
                freezeInkblot();
            }
        }

        function touchStarted() {
            if (phase === 1 && !isFrozen) {
                freezeInkblot();
                return false; // Prevent default touch behavior
            }
        }

        function freezeInkblot() {
            isFrozen = true;
            frozenCanvas = get();
            phase = 2;

            // Show oracle UI immediately
            document.getElementById('oracleUI').classList.add('active');

            // Analyze colors in background
            setTimeout(() => {
                analyzeColors();
            }, 100);
        }

        function analyzeColors() {
            dominantColors = [];
            let colorCounts = {};

            // Sample fewer pixels for faster performance
            for (let i = 0; i < 300; i++) {
                let x = floor(random(width));
                let y = floor(random(height));
                let c = frozenCanvas.get(x, y);

                if (c[3] > 50) { // Only count non-transparent pixels
                    let hue = floor(c[0]);
                    let colorName = getColorName(hue);
                    colorCounts[colorName] = (colorCounts[colorName] || 0) + 1;
                }
            }

            // Get top 3 colors
            let sortedColors = Object.entries(colorCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3);

            dominantColors = sortedColors.map(([color, count]) => ({
                name: color,
                meaning: colorReadings[color]
            }));
        }

        function getColorName(hue) {
            if (hue >= 0 && hue <= 20) return 'red';
            if (hue >= 21 && hue <= 50) return 'orange';
            if (hue >= 51 && hue <= 90) return 'yellow';
            if (hue >= 91 && hue <= 150) return 'green';
            if (hue >= 151 && hue <= 220) return 'blue';
            if (hue >= 221 && hue <= 290) return 'indigo';
            if (hue >= 291 && hue <= 330) return 'violet';
            return 'magenta';
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        // Phase 2 UI interactions
        document.getElementById('submitBtn').addEventListener('click', function() {
            let userInput = document.getElementById('userInput').value.toLowerCase();
            if (userInput.trim()) {
                showReading(userInput);
            }
        });

        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('submitBtn').click();
            }
        });

        function showReading(userInput) {
            // Display color echoes
            let colorList = document.getElementById('colorList');
            colorList.innerHTML = '';

            dominantColors.forEach(color => {
                let li = document.createElement('li');
                li.className = 'color-item';
                li.innerHTML = `<strong>${color.name.toUpperCase()}:</strong> ${color.meaning}`;
                colorList.appendChild(li);
            });

            // Find symbolic meaning using triggers
            let symbolFound = false;
            let symbolText = document.getElementById('symbolText');

            for (let symbolKey in symbolReadings) {
                let symbol = symbolReadings[symbolKey];
                // Check if any trigger word matches the user input
                for (let trigger of symbol.triggers) {
                    if (userInput.includes(trigger)) {
                        symbolText.textContent = symbol.message;
                        symbolFound = true;
                        break;
                    }
                }
                if (symbolFound) break;
            }

            if (!symbolFound) {
                symbolText.textContent = "Your symbol speaks in a rare tongue. Keep listening.";
            }

            // Show reading panel
            document.getElementById('readingPanel').style.display = 'block';

            // Set text color based on dominant color
            let oracleUI = document.getElementById('oracleUI');
            if (dominantColors.length > 0) {
                let hue = getHueFromColorName(dominantColors[0].name);
                oracleUI.style.color = `hsl(${hue}, 70%, 70%)`;
            }
        }

        function getHueFromColorName(colorName) {
            const hueMap = {
                red: 0,
                orange: 35,
                yellow: 70,
                green: 120,
                blue: 185,
                indigo: 255,
                violet: 310,
                magenta: 330
            };
            return hueMap[colorName] || 0;
        }

        document.getElementById('saveBtn').addEventListener('click', function() {
            if (frozenCanvas) {
                // Create composite image with text overlay
                let tempCanvas = createGraphics(width, height);
                tempCanvas.image(frozenCanvas, 0, 0);

                // Add text overlay
                tempCanvas.fill(255);
                tempCanvas.textAlign(CENTER);
                tempCanvas.textSize(16);
                tempCanvas.text("Psycheflux Oracle Vision", width/2, height - 50);

                // Save the image
                tempCanvas.save('psycheflux-vision.png');
            }
        });

        // New Inkblot button - reset everything
        document.getElementById('newInkblotBtn').addEventListener('click', function() {
            // Reset to phase 1
            phase = 1;
            isFrozen = false;
            frozenCanvas = null;
            dominantColors = [];

            // Hide oracle UI
            document.getElementById('oracleUI').classList.remove('active');

            // Clear input and reading panel
            document.getElementById('userInput').value = '';
            document.getElementById('readingPanel').style.display = 'none';
            document.getElementById('colorList').innerHTML = '';
            document.getElementById('symbolText').textContent = '';

            // Reinitialize particles - fewer, much larger blobs
            particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: random(-400, 400),
                    y: random(-400, 400),
                    vx: random(-2, 2),
                    vy: random(-2, 2),
                    size: random(80, 140),
                    noiseOffset: random(10000),
                    noiseScale: random(0.005, 0.02),
                    life: random(0.7, 1)
                });
            }

            // Reset hue
            currentHue = random(360);

            console.log('New inkblot generated');
        });
    </script>
</body>
</html>
