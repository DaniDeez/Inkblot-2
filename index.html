<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Psycheflux Oracle - Enter the Mystical Realm</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a, #1a0a1a, #0a1a0a);
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .portal-container {
            text-align: center;
            animation: mysticalGlow 3s ease-in-out infinite alternate;
        }

        .portal-title {
            font-size: 28px;
            margin-bottom: 40px;
            text-shadow: 0 0 30px #ff6b6b, 0 0 60px #ff6b6b;
            animation: titlePulse 2s ease-in-out infinite alternate;
        }

        .portal-subtitle {
            font-size: 12px;
            margin-bottom: 50px;
            opacity: 0.8;
            line-height: 1.8;
        }

        .enter-btn {
            background: transparent;
            border: 2px solid #ff6b6b;
            color: #fff;
            padding: 20px 40px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .enter-btn:hover {
            background: #ff6b6b;
            color: #000;
            box-shadow: 0 0 40px #ff6b6b, 0 0 80px #ff6b6b;
            transform: scale(1.05);
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .enter-btn:hover::before {
            left: 100%;
        }

        @keyframes mysticalGlow {
            0% {
                text-shadow: 0 0 20px #ff6b6b;
                filter: hue-rotate(0deg);
            }
            100% {
                text-shadow: 0 0 40px #ff6b6b, 0 0 80px #ff6b6b;
                filter: hue-rotate(30deg);
            }
        }

        @keyframes titlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .floating-orbs {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.1), transparent);
            animation: float 6s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .orb:nth-child(3) {
            width: 80px;
            height: 80px;
            bottom: 30%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="floating-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="portal-container">
        <h1 class="portal-title">🧠 PSYCHEFLUX ORACLE</h1>
        <p class="portal-subtitle">
            Enter the mystical realm where inkblots reveal<br>
            the secrets of your subconscious mind<br><br>
            Click to freeze the flowing ink<br>
            Discover what your soul sees
        </p>
        <a href="psycheflux_oracle.html" class="enter-btn">
            🔮 ENTER THE ORACLE
        </a>
    </div>

    <script>
        // Add some mystical particle effects
        document.addEventListener('mousemove', function(e) {
            if (Math.random() > 0.95) {
                createParticle(e.clientX, e.clientY);
            }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.style.position = 'absolute';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.width = '2px';
            particle.style.height = '2px';
            particle.style.background = '#ff6b6b';
            particle.style.borderRadius = '50%';
            particle.style.pointerEvents = 'none';
            particle.style.animation = 'particleFloat 2s ease-out forwards';

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 2000);
        }

        // Add particle animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes particleFloat {
                0% {
                    opacity: 1;
                    transform: translateY(0px) scale(1);
                }
                100% {
                    opacity: 0;
                    transform: translateY(-100px) scale(0);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
