<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Void Mirror - Inkblot Oracle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f7f1e1;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #newInkblotBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(10, 10, 10, 0.85);
            color: #f7f1e1;
            border: 2px solid rgba(139, 119, 101, 0.5);
            border-radius: 8px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #newInkblotBtn:hover {
            background: rgba(10, 10, 10, 0.95);
            border-color: rgba(139, 119, 101, 0.8);
            transform: scale(1.05);
        }

        #interpretationPanel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(247, 241, 225, 0.95);
            border: 3px solid rgba(10, 10, 10, 0.3);
            border-radius: 16px 16px 0 0;
            padding: 30px;
            pointer-events: all;
            opacity: 0;
            transition: opacity 0.5s ease;
            box-shadow: 0 -8px 32px rgba(10, 10, 10, 0.2);
        }

        #interpretationPanel.visible {
            opacity: 1;
        }

        .rainbow-prompt {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(90deg,
                #ff0000 0%,
                #ff7f00 16.67%,
                #ffff00 33.33%,
                #00ff00 50%,
                #0000ff 66.67%,
                #4b0082 83.33%,
                #9400d3 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowPulse 3s ease-in-out infinite;
        }

        @keyframes rainbowPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        #visionInput {
            width: 100%;
            padding: 15px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            border: 2px solid rgba(10, 10, 10, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #visionInput:focus {
            border-color: rgba(10, 10, 10, 0.6);
        }

        #submitVision {
            width: 100%;
            padding: 15px;
            background: rgba(10, 10, 10, 0.85);
            color: #f7f1e1;
            border: none;
            border-radius: 8px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #submitVision:hover {
            background: rgba(10, 10, 10, 0.95);
            transform: scale(1.02);
        }

        #readingResult {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            border: 2px solid rgba(139, 119, 101, 0.3);
            display: none;
        }

        #readingResult.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reading-section {
            margin-bottom: 20px;
        }

        .reading-section:last-child {
            margin-bottom: 0;
        }

        .reading-title {
            font-size: 18px;
            font-weight: bold;
            color: #0a0a0a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reading-content {
            font-size: 16px;
            color: #2a2a2a;
            line-height: 1.6;
        }

        .color-swatch {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid rgba(10, 10, 10, 0.3);
            vertical-align: middle;
        }

        .title-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        .title-overlay h1 {
            font-size: 28px;
            color: rgba(10, 10, 10, 0.7);
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(247, 241, 225, 0.8);
        }

        .title-overlay p {
            font-size: 14px;
            color: rgba(10, 10, 10, 0.5);
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="ui-overlay">
        <div class="title-overlay">
            <h1>The Void Mirror</h1>
            <p>Ink as shadow, silence, and unseen truth.</p>
        </div>

        <button id="newInkblotBtn">New Inkblot</button>

        <div id="interpretationPanel">
            <div class="rainbow-prompt">🌈 What do you see?</div>
            <input type="text" id="visionInput" placeholder="Type what you perceive...">
            <button id="submitVision">Submit Vision</button>
            <div id="readingResult"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const newInkblotBtn = document.getElementById('newInkblotBtn');
        const interpretationPanel = document.getElementById('interpretationPanel');
        const visionInput = document.getElementById('visionInput');
        const submitVision = document.getElementById('submitVision');
        const readingResult = document.getElementById('readingResult');

        let width, height;
        let blobs = [];
        let stars = [];
        let animationId = null;
        let isFrozen = false;
        let frozenImageData = null;
        let parchmentBackground = null; // Cache for antique parchment texture

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            parchmentBackground = null; // Reset parchment cache on resize
        }

        // Simple noise function for organic movement
        function noise(x, y) {
            const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        class Blob {
            constructor() {
                this.reset();
            }

            reset() {
                // Constrain inkblot to center 35% of screen
                const inkblotWidth = width * 0.35;
                const inkblotHeight = height * 0.35;
                const centerX = width / 2;
                const centerY = height / 2;

                // Position blobs within the center region (half goes to left side for mirroring)
                this.x = centerX - inkblotWidth / 2 + Math.random() * (inkblotWidth / 2);
                this.y = centerY - inkblotHeight / 2 + Math.random() * inkblotHeight;

                // Moderate blob sizes to show irregular features clearly
                const sizeType = Math.random();
                if (sizeType < 0.3) {
                    // Small organic blobs
                    this.baseRadius = 25 + Math.random() * 20;
                } else if (sizeType < 0.7) {
                    // Medium flowing shapes
                    this.baseRadius = 45 + Math.random() * 25;
                } else {
                    // Larger central blobs
                    this.baseRadius = 70 + Math.random() * 30;
                }

                this.radius = this.baseRadius;
                this.targetRadius = this.baseRadius;

                // More varied velocity for dynamic motion
                const speedType = Math.random();
                if (speedType < 0.3) {
                    // Slow drifters
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                } else if (speedType < 0.7) {
                    // Medium movers
                    this.vx = (Math.random() - 0.5) * 0.6;
                    this.vy = (Math.random() - 0.5) * 0.6;
                } else {
                    // Faster blobs for more dynamics
                    this.vx = (Math.random() - 0.5) * 1.0;
                    this.vy = (Math.random() - 0.5) * 1.0;
                }

                // Organic motion parameters
                this.noiseOffsetX = Math.random() * 1000;
                this.noiseOffsetY = Math.random() * 1000;
                this.noiseScale = 0.002 + Math.random() * 0.003;

                // EXTREME irregular shape deformation for wildly organic Rorschach edges
                this.shapeNoiseOffset = Math.random() * 1000;
                this.shapeComplexity = 5 + Math.floor(Math.random() * 4); // 5-8 irregular features
                this.irregularityAmount = 1.0 + Math.random() * 1.0; // 100-200% variation for dramatic tentacles

                // Varied morphing with 2-3 second cycles
                this.phase = Math.random() * Math.PI * 2;
                this.pulseSpeed = 0.03 + Math.random() * 0.025; // ~2-3 second cycles with variation
                this.pulseAmount = this.baseRadius * (0.3 + Math.random() * 0.5);

                // Lava lamp rise and fall - varied speeds
                this.verticalDrift = (Math.random() - 0.5) * 0.7;
                this.driftPhase = Math.random() * Math.PI * 2;
                this.driftSpeed = 0.004 + Math.random() * 0.012;

                // Complex morphing with multiple frequencies
                this.morphPhase = Math.random() * Math.PI * 2;
                this.morphSpeed = 0.03 + Math.random() * 0.025;
                this.morphPhase2 = Math.random() * Math.PI * 2;
                this.morphSpeed2 = 0.02 + Math.random() * 0.02;
            }

            update(time) {
                // Organic noise-based movement
                const noiseX = noise(
                    this.x * this.noiseScale + time * 0.0001,
                    this.y * this.noiseScale
                ) * 2 - 1;
                const noiseY = noise(
                    this.x * this.noiseScale,
                    this.y * this.noiseScale + time * 0.0001
                ) * 2 - 1;

                // Very gentle noise for smooth organic drift
                this.vx += noiseX * 0.08;
                this.vy += noiseY * 0.08;

                // Very slow lava lamp rise and fall
                this.driftPhase += this.driftSpeed;
                this.vy += Math.sin(this.driftPhase) * 0.1 + this.verticalDrift * 0.02;

                // Complex pulsing and morphing - multiple frequencies for organic irregularity
                this.phase += this.pulseSpeed;
                this.morphPhase += this.morphSpeed;
                this.morphPhase2 += this.morphSpeed2;

                const pulse = Math.sin(this.phase) * this.pulseAmount;
                const morph1 = Math.sin(this.morphPhase * 1.7) * (this.pulseAmount * 0.5);
                const morph2 = Math.cos(this.morphPhase2 * 2.3) * (this.pulseAmount * 0.3);
                this.targetRadius = this.baseRadius + pulse + morph1 + morph2;
                this.radius += (this.targetRadius - this.radius) * 0.08;

                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;

                // Constrain to center 35% region
                const inkblotWidth = width * 0.35;
                const inkblotHeight = height * 0.35;
                const centerX = width / 2;
                const centerY = height / 2;
                const leftBound = centerX - inkblotWidth / 2;
                const rightBound = centerX;
                const topBound = centerY - inkblotHeight / 2;
                const bottomBound = centerY + inkblotHeight / 2;

                // Soft boundary - slow down near edges, no hard bounce
                const edgeMargin = 50;
                if (this.x < leftBound + edgeMargin) {
                    this.vx += (leftBound + edgeMargin - this.x) * 0.001;
                } else if (this.x > rightBound - edgeMargin) {
                    this.vx -= (this.x - (rightBound - edgeMargin)) * 0.001;
                }

                if (this.y < topBound + edgeMargin) {
                    this.vy += (topBound + edgeMargin - this.y) * 0.001;
                } else if (this.y > bottomBound - edgeMargin) {
                    this.vy -= (this.y - (bottomBound - edgeMargin)) * 0.001;
                }

                // Gentle pull toward center
                const targetX = centerX - inkblotWidth / 4;
                const targetY = centerY;
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    this.vx += (dx / dist) * 0.01;
                    this.vy += (dy / dist) * 0.01;
                }

                // Moderate damping for more dynamic motion
                this.vx *= 0.94;
                this.vy *= 0.94;

                // More frequent random impulses for dynamic motion
                if (Math.random() < 0.02) {
                    this.vx += (Math.random() - 0.5) * 0.5;
                    this.vy += (Math.random() - 0.5) * 0.5;
                }
            }
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                const side = Math.floor(Math.random() * 4);
                switch(side) {
                    case 0: this.x = Math.random() * width; this.y = 0; break;
                    case 1: this.x = width; this.y = Math.random() * height; break;
                    case 2: this.x = Math.random() * width; this.y = height; break;
                    case 3: this.x = 0; this.y = Math.random() * height; break;
                }

                this.opacity = 0;
                this.targetOpacity = 0.05 + Math.random() * 0.15;
                this.size = 2 + Math.random() * 4;
                this.life = 0;
                this.maxLife = 200 + Math.random() * 300;
                this.phase = Math.random() * Math.PI * 2;
            }

            update() {
                this.life++;
                this.phase += 0.03;

                if (this.life < 50) {
                    this.opacity += (this.targetOpacity - this.opacity) * 0.02;
                } else if (this.life > this.maxLife - 50) {
                    this.opacity *= 0.98;
                }

                if (this.life > this.maxLife) {
                    this.reset();
                }
            }

            draw() {
                const glow = Math.sin(this.phase) * 0.5 + 0.5;
                const currentOpacity = this.opacity * glow;

                ctx.save();
                ctx.globalAlpha = currentOpacity;
                ctx.fillStyle = '#f7f1e1';
                ctx.shadowColor = '#f7f1e1';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initBlobs() {
            blobs = [];
            // Very few blobs for clear distinct irregular Rorschach shapes
            const numBlobs = 5 + Math.floor(Math.random() * 3);
            for (let i = 0; i < numBlobs; i++) {
                blobs.push(new Blob());
            }
        }

        function initStars() {
            stars = [];
            const numStars = 15 + Math.floor(Math.random() * 15);
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function drawMetaball() {
            // Get current canvas content (which should be the parchment)
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // Lower threshold to show irregular shapes while preventing over-merging
            const threshold = 0.95;

            // Calculate metaball values and draw black ink on top
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width / 2; x++) {
                    let sum = 0;

                    for (let blob of blobs) {
                        const dx = x - blob.x;
                        const dy = y - blob.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        // Add extreme irregular shape deformation using noise
                        const angle = Math.atan2(dy, dx);

                        // Multi-octave noise for complex organic edges
                        const shapeNoise1 = noise(
                            Math.cos(angle * blob.shapeComplexity) + blob.shapeNoiseOffset,
                            Math.sin(angle * blob.shapeComplexity) + blob.shapeNoiseOffset + time * 0.00008
                        );
                        const shapeNoise2 = noise(
                            Math.cos(angle * blob.shapeComplexity * 2) + blob.shapeNoiseOffset + 100,
                            Math.sin(angle * blob.shapeComplexity * 2) + blob.shapeNoiseOffset + time * 0.00012
                        );

                        // Combine noise for rich organic variation
                        const combinedNoise = shapeNoise1 * 0.7 + shapeNoise2 * 0.3;
                        const radiusVariation = 1.0 + (combinedNoise - 0.5) * blob.irregularityAmount * 2.5;
                        const effectiveRadius = Math.max(blob.radius * 0.2, blob.radius * radiusVariation);

                        const distSq = dist * dist;

                        // Metaball formula with irregular radius
                        if (distSq > 0) {
                            sum += (effectiveRadius * effectiveRadius) / distSq;
                        } else {
                            sum += effectiveRadius * 10;
                        }
                    }

                    const index = (y * width + x) * 4;

                    if (sum > threshold) {
                        // Smooth edge anti-aliasing
                        let alpha = 255;

                        if (sum < threshold * 1.5) {
                            const edgeFactor = (sum - threshold) / (threshold * 0.5);
                            alpha = Math.min(255, edgeFactor * 255);
                        }

                        // Draw black ink over parchment
                        data[index] = 10;
                        data[index + 1] = 10;
                        data[index + 2] = 10;
                        data[index + 3] = alpha;
                    }
                }
            }

            // Mirror to create symmetry
            for (let y = 0; y < height; y++) {
                for (let x = Math.floor(width / 2); x < width; x++) {
                    const mirrorX = width - x - 1;
                    const sourceIndex = (y * width + mirrorX) * 4;
                    const targetIndex = (y * width + x) * 4;

                    // Only copy if there's actual ink at the source
                    if (data[sourceIndex + 3] > 0 && data[sourceIndex] < 50) {
                        data[targetIndex] = data[sourceIndex];
                        data[targetIndex + 1] = data[sourceIndex + 1];
                        data[targetIndex + 2] = data[sourceIndex + 2];
                        data[targetIndex + 3] = data[sourceIndex + 3];
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function drawParchmentBackground() {
            // Create authentic antique parchment texture
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;

                    // Base parchment color #f7f1e1 with slight variation
                    let r = 247;
                    let g = 241;
                    let b = 225;

                    // Multi-scale paper texture (fine grain)
                    const fineNoise = noise(x * 0.5, y * 0.5);
                    const mediumNoise = noise(x * 0.1, y * 0.1);
                    const coarseNoise = noise(x * 0.02, y * 0.02);

                    const paperTexture = (fineNoise * 0.5 + mediumNoise * 0.3 + coarseNoise * 0.2) - 0.5;
                    const textureVariation = paperTexture * 25;

                    r += textureVariation;
                    g += textureVariation;
                    b += textureVariation;

                    // Add organic fiber patterns
                    const fiberNoise1 = noise(x * 0.03 + 50, y * 0.08 + 50);
                    const fiberNoise2 = noise(x * 0.08 + 150, y * 0.03 + 150);
                    if (fiberNoise1 > 0.6 || fiberNoise2 > 0.6) {
                        const fiberDark = 5;
                        r -= fiberDark;
                        g -= fiberDark;
                        b -= fiberDark;
                    }

                    // Add sepia aging spots
                    const ageSpot1 = noise(x * 0.008 + 200, y * 0.008 + 200);
                    const ageSpot2 = noise(x * 0.015 + 500, y * 0.015 + 500);

                    if (ageSpot1 > 0.65) {
                        const aging = (ageSpot1 - 0.65) * 50;
                        r -= aging * 1.0;
                        g -= aging * 1.15;
                        b -= aging * 1.4;
                    }

                    if (ageSpot2 > 0.7) {
                        const aging = (ageSpot2 - 0.7) * 30;
                        r -= aging * 0.8;
                        g -= aging * 1.0;
                        b -= aging * 1.2;
                    }

                    // Subtle vignette at edges
                    const distFromCenterX = Math.abs(x - width / 2) / (width / 2);
                    const distFromCenterY = Math.abs(y - height / 2) / (height / 2);
                    const vignette = Math.max(distFromCenterX, distFromCenterY);
                    const vignetteAmount = Math.pow(vignette, 2) * 15;

                    r -= vignetteAmount;
                    g -= vignetteAmount;
                    b -= vignetteAmount * 1.1;

                    // Clamp values
                    data[index] = Math.max(200, Math.min(255, r));
                    data[index + 1] = Math.max(195, Math.min(255, g));
                    data[index + 2] = Math.max(180, Math.min(255, b));
                    data[index + 3] = 255;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function animate(time) {
            if (isFrozen) return;

            // Draw parchment background (cached)
            if (!parchmentBackground) {
                drawParchmentBackground();
                parchmentBackground = ctx.getImageData(0, 0, width, height);
            } else {
                ctx.putImageData(parchmentBackground, 0, 0);
            }

            blobs.forEach(blob => blob.update(time));
            drawMetaball();

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            animationId = requestAnimationFrame(animate);
        }

        function freezeAnimation() {
            if (isFrozen) return;

            isFrozen = true;
            frozenImageData = ctx.getImageData(0, 0, width, height);
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            interpretationPanel.classList.add('visible');
            visionInput.focus();
        }

        function unfreezeAnimation() {
            isFrozen = false;
            interpretationPanel.classList.remove('visible');
            readingResult.classList.remove('visible');
            visionInput.value = '';
            readingResult.innerHTML = '';
            requestAnimationFrame(animate);
        }

        function generateNewInkblot() {
            if (isFrozen) {
                unfreezeAnimation();
            }
            initBlobs();
            initStars();
            parchmentBackground = null; // Reset parchment cache for new inkblot
        }

        function analyzeColors() {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            let totalR = 0, totalG = 0, totalB = 0, count = 0;

            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 128) {
                    totalR += data[i];
                    totalG += data[i + 1];
                    totalB += data[i + 2];
                    count++;
                }
            }

            if (count === 0) {
                return { r: 10, g: 10, b: 10, hex: '#0a0a0a' };
            }

            const r = Math.round(totalR / count);
            const g = Math.round(totalG / count);
            const b = Math.round(totalB / count);
            const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');

            return { r, g, b, hex };
        }

        function getColorMeaning(color) {
            const meanings = {
                black: "The void, the unconscious, mystery, depth, ancestral wisdom, the shadow self, introspection, and transformation through darkness.",
                dark: "Deep contemplation, hidden truths, the liminal space between knowing and unknowing, ancestral memories, and sacred silence."
            };

            if (color.r < 50 && color.g < 50 && color.b < 50) {
                return meanings.black;
            }
            return meanings.dark;
        }

        const oracleDict = {
            "butterfly": "Transformation, metamorphosis, the soul's journey. You are in a period of profound change.",
            "moth": "Drawn to light, seeking truth, navigating darkness with faith. Trust your inner compass.",
            "bird": "Freedom, perspective, messages from the divine. Your spirit seeks to soar above limitation.",
            "angel": "Divine protection, spiritual guidance, higher consciousness. You are being watched over.",
            "demon": "Shadow aspects, repressed emotions, inner conflict. Face your fears with compassion.",
            "face": "The self reflected back, identity, persona. Who are you beneath the masks you wear?",
            "eyes": "Perception, awareness, being seen. What truth are you finally ready to witness?",
            "skull": "Mortality, impermanence, transformation through death. Endings make way for beginnings.",
            "tree": "Growth, roots, connection between earth and sky. You are grounded yet reaching.",
            "flower": "Beauty emerging, unfolding, delicate strength. Allow yourself to bloom.",
            "heart": "Love, emotion, the center of being. What does your heart truly desire?",
            "hands": "Action, creation, connection. What are you reaching for or releasing?",
            "spider": "Weaver of fate, patience, creative power. You are spinning your own reality.",
            "snake": "Transformation, kundalini energy, healing. Shed what no longer serves you.",
            "dragon": "Primal power, fire, guardian of treasures. Your strength is awakening.",

        function getOracleReading(vision) {
            const lowerVision = vision.toLowerCase().trim();

            for (let [key, meaning] of Object.entries(oracleDict)) {
                if (lowerVision.includes(key)) {
                    return { symbol: key, meaning: meaning };
                }
            }

            const wordCount = lowerVision.split(/\s+/).length;
            const genericReadings = [
                {
                    symbol: "the mirror's reflection",
                    meaning: "What you see is a projection of your inner landscape. The subconscious speaks in shapes that logic cannot name. Trust what emerges from the void."
                },
                {
                    symbol: "unnamed form",
                    meaning: "Not all visions have words. Some truths exist beyond language, in the realm of pure perception. Your interpretation is valid simply because you perceived it."
                },
                {
                    symbol: "personal symbolism",
                    meaning: "This image belongs to you alone. It comes from the depths of your unique psyche, carrying meaning that only you can fully decipher. Honor your vision."
                }
            ];

            return genericReadings[Math.floor(Math.random() * genericReadings.length)];
        }

        function displayReading(vision) {
            const colors = analyzeColors();
            const colorMeaning = getColorMeaning(colors);
            const oracle = getOracleReading(vision);

            readingResult.innerHTML = `
                <div class="reading-section">
                    <div class="reading-title">Color Reading</div>
                    <div class="reading-content">
                        <span class="color-swatch" style="background-color: ${colors.hex};"></span>
                        <strong>Dominant Hue:</strong> ${colors.hex}<br>
                        <strong>Meaning:</strong> ${colorMeaning}
                    </div>
                </div>
                <div class="reading-section">
                    <div class="reading-title">Symbolic Interpretation</div>
                    <div class="reading-content">
                        <strong>You Perceived:</strong> "${vision}"<br>
                        <strong>Symbol:</strong> ${oracle.symbol}<br>
                        <strong>Oracle Message:</strong> ${oracle.meaning}
                    </div>
                </div>
            `;

            readingResult.classList.add('visible');
        }

        canvas.addEventListener('click', () => {
            if (!isFrozen) {
                freezeAnimation();
            }
        });

        newInkblotBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            generateNewInkblot();
        });

        submitVision.addEventListener('click', () => {
            const vision = visionInput.value.trim();
            if (vision) {
                displayReading(vision);
            }
        });

        visionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const vision = visionInput.value.trim();
                if (vision) {
                    displayReading(vision);
                }
            }
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            if (isFrozen && frozenImageData) {
                ctx.putImageData(frozenImageData, 0, 0);
            }
        });

        resizeCanvas();

        // Initialize parchment background immediately to avoid black screen
        drawParchmentBackground();
        parchmentBackground = ctx.getImageData(0, 0, width, height);

        initBlobs();
        initStars();

        // Draw initial frame immediately before animation starts
        ctx.putImageData(parchmentBackground, 0, 0);
        drawMetaball();

        // Draw initial stars
        stars.forEach(star => star.draw());

        // Start animation loop with requestAnimationFrame (provides time parameter)
        requestAnimationFrame(animate);
    </script>
