<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psycheflux Oracle - The Living Mirror of Light</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- New Inkblot Button - Top Right -->
  <button id="new-inkblot-btn" class="new-inkblot-btn">✨ New Inkblot</button>

  <!-- Header Section -->
  <header class="oracle-header">
    <h1>The Living Mirror of Light</h1>
    <p class="subtitle">Every symbol is a memory—what reflection has chosen to return?</p>
  </header>

  <!-- Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Phase 2: Reflection Interface (Hidden initially) -->
  <div id="reflection-interface" class="hidden">

    <div class="prompt-container">
      <p class="prompt-text">What do you see beneath the surface?</p>

      <input
        type="text"
        id="user-input"
        class="reflection-input"
        placeholder="Describe the shapes, symbols, or feelings..."
        maxlength="200"
      />

      <button id="submit-btn" class="submit-button">
        Receive Oracle
      </button>
    </div>

    <div id="oracle-message" class="oracle-message hidden"></div>

    <div class="action-buttons hidden" id="action-buttons">
      <button id="save-btn" class="save-button">
        💾 Save This Vision
      </button>
      <button id="reset-btn" class="reset-button">
        🌊 Return to the Mirror
      </button>
    </div>
  </div>

  <!-- Footer Credits -->
  <footer class="oracle-footer">
    <p>A ritual space for symbolic emergence.</p>
  </footer>

  <script src="sketch.js"></script>
</body>
</html>
