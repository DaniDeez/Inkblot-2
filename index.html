<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Void Mirror - Inkblot Oracle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f7f1e1;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #newInkblotBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(10, 10, 10, 0.85);
            color: #f7f1e1;
            border: 2px solid rgba(139, 119, 101, 0.5);
            border-radius: 8px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #newInkblotBtn:hover {
            background: rgba(10, 10, 10, 0.95);
            border-color: rgba(139, 119, 101, 0.8);
            transform: scale(1.05);
        }

        #interpretationPanel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(247, 241, 225, 0.95);
            border: 3px solid rgba(10, 10, 10, 0.3);
            border-radius: 16px 16px 0 0;
            padding: 30px;
            pointer-events: all;
            opacity: 0;
            transition: opacity 0.5s ease;
            box-shadow: 0 -8px 32px rgba(10, 10, 10, 0.2);
        }

        #interpretationPanel.visible {
            opacity: 1;
        }

        .rainbow-prompt {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(90deg,
                #ff0000 0%,
                #ff7f00 16.67%,
                #ffff00 33.33%,
                #00ff00 50%,
                #0000ff 66.67%,
                #4b0082 83.33%,
                #9400d3 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowPulse 3s ease-in-out infinite;
        }

        @keyframes rainbowPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        #visionInput {
            width: 100%;
            padding: 15px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            border: 2px solid rgba(10, 10, 10, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #visionInput:focus {
            border-color: rgba(10, 10, 10, 0.6);
        }

        #submitVision {
            width: 100%;
            padding: 15px;
            background: rgba(10, 10, 10, 0.85);
            color: #f7f1e1;
            border: none;
            border-radius: 8px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #submitVision:hover {
            background: rgba(10, 10, 10, 0.95);
            transform: scale(1.02);
        }

        #readingResult {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            border: 2px solid rgba(139, 119, 101, 0.3);
            display: none;
        }

        #readingResult.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reading-section {
            margin-bottom: 20px;
        }

        .reading-section:last-child {
            margin-bottom: 0;
        }

        .reading-title {
            font-size: 18px;
            font-weight: bold;
            color: #0a0a0a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reading-content {
            font-size: 16px;
            color: #2a2a2a;
            line-height: 1.6;
        }

        .color-swatch {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid rgba(10, 10, 10, 0.3);
            vertical-align: middle;
        }

        .title-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        .title-overlay h1 {
            font-size: 28px;
            color: rgba(10, 10, 10, 0.7);
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(247, 241, 225, 0.8);
        }

        .title-overlay p {
            font-size: 14px;
            color: rgba(10, 10, 10, 0.5);
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="ui-overlay">
        <div class="title-overlay">
            <h1>The Void Mirror</h1>
            <p>Ink as shadow, silence, and unseen truth.</p>
        </div>

        <button id="newInkblotBtn">New Inkblot</button>

        <div id="interpretationPanel">
            <div class="rainbow-prompt">🌈 What do you see?</div>
            <input type="text" id="visionInput" placeholder="Type what you perceive...">
            <button id="submitVision">Submit Vision</button>
            <div id="readingResult"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const newInkblotBtn = document.getElementById('newInkblotBtn');
        const interpretationPanel = document.getElementById('interpretationPanel');
        const visionInput = document.getElementById('visionInput');
        const submitVision = document.getElementById('submitVision');
        const readingResult = document.getElementById('readingResult');

        let width, height;
        let blobs = [];
        let stars = [];
        let animationId = null;
        let isFrozen = false;
        let parchmentBackground = null; // Cache for antique parchment texture
        let lowResParchment = null; // Cache for low-res parchment
        let tempCanvas = null; // Reusable temp canvas for metaball rendering
        let tempCtx = null;
        let currentGradientColor = { h: 0, s: 70, l: 50 }; // HSL color
        let frozenGradientColor = null; // Frozen gradient color for reading

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            parchmentBackground = null; // Reset parchment cache on resize
            lowResParchment = null; // Reset low-res parchment
            tempCanvas = null; // Reset temp canvas
            tempCtx = null;
        }

        // Improved Perlin-like noise function for smooth organic shapes
        function noise(x, y) {
            const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        // Smooth interpolation for organic curves
        function smoothstep(t) {
            return t * t * (3 - 2 * t);
        }

        // Multi-octave noise for complex organic patterns
        function perlinNoise(x, y, octaves = 4) {
            let value = 0;
            let amplitude = 1;
            let frequency = 1;
            let maxValue = 0;

            for (let i = 0; i < octaves; i++) {
                value += noise(x * frequency, y * frequency) * amplitude;
                maxValue += amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }

            return value / maxValue;
        }

        // Organic noise with smooth interpolation
        function organicNoise(x, y, seed = 0) {
            const xi = Math.floor(x);
            const yi = Math.floor(y);
            const xf = x - xi;
            const yf = y - yi;

            const n00 = noise(xi + seed, yi + seed);
            const n10 = noise(xi + 1 + seed, yi + seed);
            const n01 = noise(xi + seed, yi + 1 + seed);
            const n11 = noise(xi + 1 + seed, yi + 1 + seed);

            const nx0 = n00 * (1 - smoothstep(xf)) + n10 * smoothstep(xf);
            const nx1 = n01 * (1 - smoothstep(xf)) + n11 * smoothstep(xf);

            return nx0 * (1 - smoothstep(yf)) + nx1 * smoothstep(yf);
        }

        class Blob {
            constructor() {
                this.reset();
            }

            reset() {
                // Balanced region size for dynamic movement and connection
                const inkblotWidth = width * 0.30;
                const inkblotHeight = height * 0.32;
                const centerX = width / 2;
                const centerY = height / 2;

                // Position blobs closer together within center region
                this.x = centerX - inkblotWidth / 2 + Math.random() * (inkblotWidth / 2);
                this.y = centerY - inkblotHeight / 2 + Math.random() * inkblotHeight;

                // Varied blob sizes for dynamic abstract patterns
                const sizeType = Math.random();
                if (sizeType < 0.3) {
                    // Tiny abstract details
                    this.baseRadius = 20 + Math.random() * 15;
                } else if (sizeType < 0.7) {
                    // Medium dynamic blobs
                    this.baseRadius = 35 + Math.random() * 25;
                } else {
                    // Larger dramatic shapes
                    this.baseRadius = 60 + Math.random() * 30;
                }

                this.radius = this.baseRadius;
                this.targetRadius = this.baseRadius;

                // Highly varied velocity for dynamic abstract motion
                const speedVariation = Math.random();
                if (speedVariation < 0.25) {
                    // Slow drifters
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = (Math.random() - 0.5) * 1.5;
                } else if (speedVariation < 0.65) {
                    // Medium flow
                    this.vx = (Math.random() - 0.5) * 2.5;
                    this.vy = (Math.random() - 0.5) * 2.5;
                } else {
                    // Fast dynamic movers
                    this.vx = (Math.random() - 0.5) * 3.5;
                    this.vy = (Math.random() - 0.5) * 3.5;
                }

                // Organic motion parameters
                this.noiseOffsetX = Math.random() * 1000;
                this.noiseOffsetY = Math.random() * 1000;
                this.noiseScale = 0.002 + Math.random() * 0.003;

                // Complex organic parameters for chaotic unpredictable patterns
                this.shapeNoiseOffset = Math.random() * 1000;
                this.shapeNoiseOffset2 = Math.random() * 1000 + 500;
                this.shapeNoiseOffset3 = Math.random() * 1000 + 1000; // Third chaos layer

                // Extreme complexity for unpredictable chaos
                this.shapeComplexity = 8 + Math.floor(Math.random() * 10); // 8-17 chaotic features
                this.shapeComplexity2 = 12 + Math.floor(Math.random() * 12); // 12-23 detail chaos
                this.shapeComplexity3 = 18 + Math.floor(Math.random() * 15); // 18-32 micro-chaos

                // Extreme irregularity for unpredictable abstract chaos
                this.irregularityAmount = 0.5 + Math.random() * 0.7; // 50-120% chaotic variation
                this.irregularityAmount2 = 0.3 + Math.random() * 0.5; // 30-80% detail chaos
                this.irregularityAmount3 = 0.2 + Math.random() * 0.4; // 20-60% micro-chaos

                // Random angular offsets for unpredictable feature placement
                this.angularOffset1 = Math.random() * Math.PI * 2;
                this.angularOffset2 = Math.random() * Math.PI * 2;
                this.angularOffset3 = Math.random() * Math.PI * 2;

                // Fast dynamic morphing for abstract patterns
                this.phase = Math.random() * Math.PI * 2;
                this.pulseSpeed = 0.04 + Math.random() * 0.04; // ~1.5-2.5 second fast cycles
                this.pulseAmount = this.baseRadius * (0.6 + Math.random() * 0.6); // Dramatic size changes

                // Lava lamp rise and fall - varied speeds
                this.verticalDrift = (Math.random() - 0.5) * 0.7;
                this.driftPhase = Math.random() * Math.PI * 2;
                this.driftSpeed = 0.004 + Math.random() * 0.012;

                // Complex morphing with multiple frequencies
                this.morphPhase = Math.random() * Math.PI * 2;
                this.morphSpeed = 0.03 + Math.random() * 0.025;
                this.morphPhase2 = Math.random() * Math.PI * 2;
                this.morphSpeed2 = 0.02 + Math.random() * 0.02;
            }

            update(time) {
                // Organic noise-based movement
                const noiseX = noise(
                    this.x * this.noiseScale + time * 0.0001,
                    this.y * this.noiseScale
                ) * 2 - 1;
                const noiseY = noise(
                    this.x * this.noiseScale,
                    this.y * this.noiseScale + time * 0.0001
                ) * 2 - 1;

                // Very gentle noise for smooth organic drift
                this.vx += noiseX * 0.08;
                this.vy += noiseY * 0.08;

                // Very slow lava lamp rise and fall
                this.driftPhase += this.driftSpeed;
                this.vy += Math.sin(this.driftPhase) * 0.1 + this.verticalDrift * 0.02;

                // Complex pulsing and morphing - multiple frequencies for organic irregularity
                this.phase += this.pulseSpeed;
                this.morphPhase += this.morphSpeed;
                this.morphPhase2 += this.morphSpeed2;

                const pulse = Math.sin(this.phase) * this.pulseAmount;
                const morph1 = Math.sin(this.morphPhase * 1.7) * (this.pulseAmount * 0.5);
                const morph2 = Math.cos(this.morphPhase2 * 2.3) * (this.pulseAmount * 0.3);
                this.targetRadius = this.baseRadius + pulse + morph1 + morph2;
                this.radius += (this.targetRadius - this.radius) * 0.08;

                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;

                // Constrain to center 35% region
                const inkblotWidth = width * 0.35;
                const inkblotHeight = height * 0.35;
                const centerX = width / 2;
                const centerY = height / 2;
                const leftBound = centerX - inkblotWidth / 2;
                const rightBound = centerX;
                const topBound = centerY - inkblotHeight / 2;
                const bottomBound = centerY + inkblotHeight / 2;

                // Soft boundary - slow down near edges, no hard bounce
                const edgeMargin = 50;
                if (this.x < leftBound + edgeMargin) {
                    this.vx += (leftBound + edgeMargin - this.x) * 0.001;
                } else if (this.x > rightBound - edgeMargin) {
                    this.vx -= (this.x - (rightBound - edgeMargin)) * 0.001;
                }

                if (this.y < topBound + edgeMargin) {
                    this.vy += (topBound + edgeMargin - this.y) * 0.001;
                } else if (this.y > bottomBound - edgeMargin) {
                    this.vy -= (this.y - (bottomBound - edgeMargin)) * 0.001;
                }

                // Gentle pull toward center
                const targetX = centerX - inkblotWidth / 4;
                const targetY = centerY;
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    this.vx += (dx / dist) * 0.01;
                    this.vy += (dy / dist) * 0.01;
                }

                // Light damping for sustained dynamic motion
                this.vx *= 0.98;
                this.vy *= 0.98;

                // More frequent random impulses for dynamic motion
                if (Math.random() < 0.02) {
                    this.vx += (Math.random() - 0.5) * 0.5;
                    this.vy += (Math.random() - 0.5) * 0.5;
                }
            }
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                const side = Math.floor(Math.random() * 4);
                switch(side) {
                    case 0: this.x = Math.random() * width; this.y = 0; break;
                    case 1: this.x = width; this.y = Math.random() * height; break;
                    case 2: this.x = Math.random() * width; this.y = height; break;
                    case 3: this.x = 0; this.y = Math.random() * height; break;
                }

                this.opacity = 0;
                this.targetOpacity = 0.05 + Math.random() * 0.15;
                this.size = 2 + Math.random() * 4;
                this.life = 0;
                this.maxLife = 200 + Math.random() * 300;
                this.phase = Math.random() * Math.PI * 2;
            }

            update() {
                this.life++;
                this.phase += 0.03;

                if (this.life < 50) {
                    this.opacity += (this.targetOpacity - this.opacity) * 0.02;
                } else if (this.life > this.maxLife - 50) {
                    this.opacity *= 0.98;
                }

                if (this.life > this.maxLife) {
                    this.reset();
                }
            }

            draw() {
                const glow = Math.sin(this.phase) * 0.5 + 0.5;
                const currentOpacity = this.opacity * glow;

                ctx.save();
                ctx.globalAlpha = currentOpacity;
                ctx.fillStyle = '#f7f1e1';
                ctx.shadowColor = '#f7f1e1';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initBlobs() {
            blobs = [];
            // Small number of blobs for clean dynamic connecting/disconnecting
            const numBlobs = 4 + Math.floor(Math.random() * 3);
            for (let i = 0; i < numBlobs; i++) {
                blobs.push(new Blob());
            }
        }

        function initStars() {
            stars = [];
            const numStars = 15 + Math.floor(Math.random() * 15);
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function drawMetaball(time) {
            // Render at VERY low resolution for extreme performance (16x faster!)
            const scale = 0.25; // Render at quarter resolution
            const renderWidth = Math.floor(width * scale);
            const renderHeight = Math.floor(height * scale);

            // Create temp canvas once and reuse
            if (!tempCanvas || tempCanvas.width !== renderWidth) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = renderWidth;
                tempCanvas.height = renderHeight;
                tempCtx = tempCanvas.getContext('2d', { alpha: true });
            }

            // Cache low-res parchment background
            if (!lowResParchment || lowResParchment.width !== renderWidth) {
                tempCtx.drawImage(canvas, 0, 0, renderWidth, renderHeight);
                lowResParchment = tempCtx.getImageData(0, 0, renderWidth, renderHeight);
            }

            // Start with cached low-res parchment
            const imageData = tempCtx.createImageData(renderWidth, renderHeight);
            imageData.data.set(lowResParchment.data);
            const data = imageData.data;

            // Higher threshold for cleaner separation with occasional merging
            const threshold = 1.1;

            // Calculate metaball values and draw black ink on top (at low res)
            for (let y = 0; y < renderHeight; y++) {
                for (let x = 0; x < renderWidth / 2; x++) {
                    let sum = 0;

                    for (let blob of blobs) {
                        // Scale blob positions to match render resolution
                        const dx = x - (blob.x * scale);
                        const dy = y - (blob.y * scale);
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        // Chaotic unpredictable shape deformation with triple-layer noise
                        const angle = Math.atan2(dy, dx);

                        // Layer 1: Primary chaotic features with random angular offset
                        const angle1 = angle * blob.shapeComplexity + blob.angularOffset1;
                        const shape1X = Math.cos(angle1) * 0.08;
                        const shape1Y = Math.sin(angle1) * 0.08;
                        const shapeNoise1 = organicNoise(
                            shape1X + blob.shapeNoiseOffset,
                            shape1Y + blob.shapeNoiseOffset + time * 0.00008
                        );

                        // Layer 2: Secondary chaotic detail with offset
                        const angle2 = angle * blob.shapeComplexity2 + blob.angularOffset2;
                        const shape2X = Math.cos(angle2) * 0.1;
                        const shape2Y = Math.sin(angle2) * 0.1;
                        const shapeNoise2 = organicNoise(
                            shape2X + blob.shapeNoiseOffset2,
                            shape2Y + blob.shapeNoiseOffset2 + time * 0.00012,
                            200
                        );

                        // Layer 3: Micro-chaos for extreme unpredictability
                        const angle3 = angle * blob.shapeComplexity3 + blob.angularOffset3;
                        const shape3X = Math.cos(angle3) * 0.12;
                        const shape3Y = Math.sin(angle3) * 0.12;
                        const shapeNoise3 = organicNoise(
                            shape3X + blob.shapeNoiseOffset3,
                            shape3Y + blob.shapeNoiseOffset3 + time * 0.00015,
                            400
                        );

                        // Add random time-varying mutations for chaos
                        const timeChaos = Math.sin(time * 0.0003 + blob.shapeNoiseOffset) * 0.5 + 0.5;
                        const randomSpike = noise(angle * 50 + time * 0.0001, blob.shapeNoiseOffset);

                        // Combine all chaos layers
                        const layer1 = (shapeNoise1 - 0.5) * blob.irregularityAmount;
                        const layer2 = (shapeNoise2 - 0.5) * blob.irregularityAmount2;
                        const layer3 = (shapeNoise3 - 0.5) * blob.irregularityAmount3;
                        const mutation = (randomSpike - 0.5) * timeChaos * 0.6;

                        const totalVariation = layer1 + layer2 + layer3 + mutation;
                        const radiusVariation = 1.0 + totalVariation * 3.0; // Extreme chaos multiplier

                        // Very wide bounds for extreme unpredictable protrusions
                        const scaledRadius = blob.radius * scale;
                        const effectiveRadius = Math.max(scaledRadius * 0.2, Math.min(scaledRadius * 2.5, scaledRadius * radiusVariation));

                        const distSq = dist * dist;

                        // Metaball formula with irregular radius
                        if (distSq > 0) {
                            sum += (effectiveRadius * effectiveRadius) / distSq;
                        } else {
                            sum += effectiveRadius * 10;
                        }
                    }

                    const index = (y * renderWidth + x) * 4;

                    if (sum > threshold) {
                        // Smooth edge anti-aliasing for organic look
                        let alpha = 255;

                        const edgeThickness = 0.3;
                        if (sum < threshold * (1 + edgeThickness)) {
                            const edgeFactor = (sum - threshold) / (threshold * edgeThickness);
                            alpha = Math.min(255, Math.max(0, edgeFactor * 255));
                        }

                        // Draw black ink over parchment
                        data[index] = 10;
                        data[index + 1] = 10;
                        data[index + 2] = 10;
                        data[index + 3] = alpha;
                    }
                }
            }

            // Mirror to create symmetry (at low res)
            for (let y = 0; y < renderHeight; y++) {
                for (let x = Math.floor(renderWidth / 2); x < renderWidth; x++) {
                    const mirrorX = renderWidth - x - 1;
                    const sourceIndex = (y * renderWidth + mirrorX) * 4;
                    const targetIndex = (y * renderWidth + x) * 4;

                    // Only copy if there's actual ink at the source
                    if (data[sourceIndex + 3] > 0 && data[sourceIndex] < 50) {
                        data[targetIndex] = data[sourceIndex];
                        data[targetIndex + 1] = data[sourceIndex + 1];
                        data[targetIndex + 2] = data[sourceIndex + 2];
                        data[targetIndex + 3] = data[sourceIndex + 3];
                    }
                }
            }

            // Put low-res image data back to temp canvas
            tempCtx.putImageData(imageData, 0, 0);

            // Scale up to full resolution with smooth interpolation
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(tempCanvas, 0, 0, renderWidth, renderHeight, 0, 0, width, height);
        }

        function drawParchmentBackground() {
            // Create authentic antique parchment texture
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;

                    // Base parchment color #f7f1e1 with slight variation
                    let r = 247;
                    let g = 241;
                    let b = 225;

                    // Multi-scale paper texture (fine grain)
                    const fineNoise = noise(x * 0.5, y * 0.5);
                    const mediumNoise = noise(x * 0.1, y * 0.1);
                    const coarseNoise = noise(x * 0.02, y * 0.02);

                    const paperTexture = (fineNoise * 0.5 + mediumNoise * 0.3 + coarseNoise * 0.2) - 0.5;
                    const textureVariation = paperTexture * 25;

                    r += textureVariation;
                    g += textureVariation;
                    b += textureVariation;

                    // Add organic fiber patterns
                    const fiberNoise1 = noise(x * 0.03 + 50, y * 0.08 + 50);
                    const fiberNoise2 = noise(x * 0.08 + 150, y * 0.03 + 150);
                    if (fiberNoise1 > 0.6 || fiberNoise2 > 0.6) {
                        const fiberDark = 5;
                        r -= fiberDark;
                        g -= fiberDark;
                        b -= fiberDark;
                    }

                    // Add sepia aging spots
                    const ageSpot1 = noise(x * 0.008 + 200, y * 0.008 + 200);
                    const ageSpot2 = noise(x * 0.015 + 500, y * 0.015 + 500);

                    if (ageSpot1 > 0.65) {
                        const aging = (ageSpot1 - 0.65) * 50;
                        r -= aging * 1.0;
                        g -= aging * 1.15;
                        b -= aging * 1.4;
                    }

                    if (ageSpot2 > 0.7) {
                        const aging = (ageSpot2 - 0.7) * 30;
                        r -= aging * 0.8;
                        g -= aging * 1.0;
                        b -= aging * 1.2;
                    }

                    // Subtle vignette at edges
                    const distFromCenterX = Math.abs(x - width / 2) / (width / 2);
                    const distFromCenterY = Math.abs(y - height / 2) / (height / 2);
                    const vignette = Math.max(distFromCenterX, distFromCenterY);
                    const vignetteAmount = Math.pow(vignette, 2) * 15;

                    r -= vignetteAmount;
                    g -= vignetteAmount;
                    b -= vignetteAmount * 1.1;

                    // Clamp values
                    data[index] = Math.max(200, Math.min(255, r));
                    data[index + 1] = Math.max(195, Math.min(255, g));
                    data[index + 2] = Math.max(180, Math.min(255, b));
                    data[index + 3] = 255;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function drawGlowingGradient(time) {
            // Animate the gradient color through hue spectrum
            currentGradientColor.h = (time * 0.02) % 360; // Full spectrum cycle

            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = Math.max(width, height) * 0.6;

            // Create radial gradient
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, maxRadius
            );

            // Create glowing effect with multiple color stops
            const h = currentGradientColor.h;
            const innerColor = `hsla(${h}, 80%, 60%, 0.4)`;
            const midColor = `hsla(${h}, 70%, 50%, 0.2)`;
            const outerColor = `hsla(${h}, 60%, 40%, 0)`;

            gradient.addColorStop(0, innerColor);
            gradient.addColorStop(0.5, midColor);
            gradient.addColorStop(1, outerColor);

            // Draw gradient over parchment
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function animate(time) {
            if (isFrozen) return;

            // Draw parchment background (cached)
            if (!parchmentBackground) {
                drawParchmentBackground();
                parchmentBackground = ctx.getImageData(0, 0, width, height);
            } else {
                ctx.putImageData(parchmentBackground, 0, 0);
            }

            // Draw animated glowing gradient
            drawGlowingGradient(time);

            blobs.forEach(blob => blob.update(time));
            drawMetaball(time);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            animationId = requestAnimationFrame(animate);
        }

            isFrozen = false;

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
        }

        function analyzeColors() {

            if (frozenGradientColor) {

                    frozenGradientColor.h,
                    frozenGradientColor.s,
                    frozenGradientColor.l
                );
                const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
                return { r, g, b, hex };
            }

            // Fallback to black if no frozen color
            return { r: 10, g: 10, b: 10, hex: '#0a0a0a' };
        }
