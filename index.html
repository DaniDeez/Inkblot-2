<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkblot Simulator - Oracle Mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        #inkblot-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #new-inkblot-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        #new-inkblot-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        #prompt-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            padding: 30px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
        }

        #prompt-container.show {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes rainbow {
            0% { color: #ff0080; }
            14% { color: #ff8c00; }
            28% { color: #ffd700; }
            42% { color: #00ff00; }
            57% { color: #00ffff; }
            71% { color: #0080ff; }
            85% { color: #8000ff; }
            100% { color: #ff0080; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        #rainbow-prompt {
            font-size: 32px;
            font-weight: 700;
            animation: rainbow 3s linear infinite, pulse 2s ease-in-out infinite;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #user-input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        #user-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #submit-btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        #result-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            gap: 25px;
            z-index: 1001;
            padding: 40px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        #result-container.show {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        .result-section {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .result-content {
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }

        .color-sample {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 0 5px;
            vertical-align: middle;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        #close-result-btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: center;
        }

        #close-result-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="inkblot-canvas"></canvas>
    </div>

    <button id="new-inkblot-btn">✨ New Inkblot</button>

    <div id="prompt-container">
        <div id="rainbow-prompt">🌈 What do you see?</div>
        <input type="text" id="user-input" placeholder="Type what you perceive...">
        <button id="submit-btn">Reveal</button>
    </div>

    <div id="result-container">
        <div class="result-section">
            <div class="result-title">Color Reading</div>
            <div id="color-reading" class="result-content"></div>
        </div>
        <div class="result-section">
            <div class="result-title">Symbolic Interpretation</div>
            <div id="symbolic-interpretation" class="result-content"></div>
        </div>
        <button id="close-result-btn">Continue</button>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('inkblot-canvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let isAnimating = true;
        let inkblotState = null;
        let frozenImageData = null;

        // Resize canvas to full screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Color palette for transitions
        const colorPalettes = [
            ['#ff0080', '#ff8c00', '#ffd700', '#00ff00', '#00ffff'],
            ['#8000ff', '#ff0080', '#ff1493', '#ff69b4', '#ffc0cb'],
            ['#00ffff', '#0080ff', '#0000ff', '#8000ff', '#ff00ff'],
            ['#ffd700', '#ff8c00', '#ff4500', '#ff0000', '#dc143c'],
            ['#00ff00', '#32cd32', '#00fa9a', '#00ffff', '#1e90ff']
        ];

        // Inkblot generator class
        class Inkblot {
            constructor() {
                this.points = [];
                this.numPoints = 15 + Math.floor(Math.random() * 10);
                this.centerX = canvas.width / 2;
                this.centerY = canvas.height / 2;
                this.palette = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
                this.colorIndex = 0;
                this.colorTransition = 0;
                this.time = 0;

                // Initialize points
                for (let i = 0; i < this.numPoints; i++) {
                    const angle = (Math.PI * 2 * i) / this.numPoints;
                    const radius = 100 + Math.random() * 200;
                    const speed = 0.001 + Math.random() * 0.002;
                    const amplitude = 20 + Math.random() * 50;

                    this.points.push({
                        angle,
                        baseRadius: radius,
                        radius,
                        speed,
                        amplitude,
                        offset: Math.random() * Math.PI * 2
                    });
                }
            }

            update() {
                this.time += 0.016; // ~60fps
                this.colorTransition += 0.002;

                if (this.colorTransition >= 1) {
                    this.colorTransition = 0;
                    this.colorIndex = (this.colorIndex + 1) % this.palette.length;
                }

                // Update point positions with organic motion
                this.points.forEach(point => {
                    const wave = Math.sin(this.time * point.speed + point.offset);
                    point.radius = point.baseRadius + wave * point.amplitude;
                });
            }

            getCurrentColor() {
                const color1 = this.palette[this.colorIndex];
                const color2 = this.palette[(this.colorIndex + 1) % this.palette.length];
                return this.interpolateColor(color1, color2, this.colorTransition);
            }

            interpolateColor(color1, color2, t) {
                const r1 = parseInt(color1.slice(1, 3), 16);
                const g1 = parseInt(color1.slice(3, 5), 16);
                const b1 = parseInt(color1.slice(5, 7), 16);

                const r2 = parseInt(color2.slice(1, 3), 16);
                const g2 = parseInt(color2.slice(3, 5), 16);
                const b2 = parseInt(color2.slice(5, 7), 16);

                const r = Math.round(r1 + (r2 - r1) * t);
                const g = Math.round(g1 + (g2 - g1) * t);
                const b = Math.round(b1 + (b2 - b1) * t);

                return `rgb(${r}, ${g}, ${b})`;
            }

            draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const color = this.getCurrentColor();

                // Draw left half (original)
                ctx.save();
                ctx.beginPath();

                this.points.forEach((point, i) => {
                    const x = this.centerX + Math.cos(point.angle) * point.radius;
                    const y = this.centerY + Math.sin(point.angle) * point.radius;

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });

                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                // Add glow effect
                ctx.shadowBlur = 30;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.restore();

                // Draw right half (mirrored)
                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);

                ctx.beginPath();
                this.points.forEach((point, i) => {
                    const x = this.centerX + Math.cos(point.angle) * point.radius;
                    const y = this.centerY + Math.sin(point.angle) * point.radius;

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });

                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                ctx.shadowBlur = 30;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Oracle dictionary for symbolic interpretations
        const oracleDict = {
            // Animals
            'butterfly': 'Transformation and rebirth. You are in a period of metamorphosis, shedding old patterns to embrace your true self.',
            'bird': 'Freedom and perspective. Your spirit seeks higher ground, yearning to see beyond current limitations.',
            'snake': 'Healing and renewal. The serpent sheds its skin, symbolizing your capacity for profound transformation.',
            'wolf': 'Instinct and intuition. Trust your inner knowing; your primal wisdom guides you through the darkness.',
            'cat': 'Independence and mystery. You walk between worlds, comfortable in the unknown.',
            'spider': 'Creativity and fate. You are the weaver of your own destiny, each thread intentional.',
            'eagle': 'Vision and courage. You see truth from great heights; trust your clarity.',
            'dragon': 'Power and magic. Ancient wisdom awakens within you, fierce and transformative.',
            'fish': 'Depth and emotion. You navigate the unconscious waters with grace.',
            'bat': 'Rebirth and initiation. You face the void and emerge transformed.',

            // Human forms
            'face': 'Identity and recognition. You seek to be seen and to see yourself clearly.',
            'eyes': 'Awareness and perception. What you observe reflects what you need to understand.',
            'hands': 'Creation and connection. You are ready to grasp new opportunities or let go of the old.',
            'heart': 'Love and emotion. The core of your being speaks; listen with compassion.',
            'figure': 'The self. A reflection of your whole being, seen and unseen.',
            'mask': 'Persona and authenticity. What do you show the world versus who you truly are?',

            // Nature
            'tree': 'Growth and grounding. Your roots run deep; your branches reach toward light.',
            'flower': 'Beauty and unfolding. You are blossoming into your fullness.',
            'mountain': 'Stability and challenge. The summit awaits, but the journey transforms you.',
            'ocean': 'Vastness and emotion. You contain multitudes, waves of feeling and depth.',
            'fire': 'Passion and purification. What burns away is no longer needed.',
            'water': 'Flow and feeling. Emotions move through you; resistance creates suffering.',
            'cloud': 'Transition and imagination. You are between states, formless yet full of potential.',
            'moon': 'Cycles and intuition. Honor the rhythm of dark and light within you.',
            'sun': 'Vitality and clarity. Your inner light shines; let it guide you.',
            'star': 'Hope and guidance. Even in darkness, you navigate by celestial truth.',

            // Symbols
            'wings': 'Ascension and freedom. You are ready to rise above limitation.',
            'crown': 'Authority and sovereignty. You are the ruler of your inner kingdom.',
            'mirror': 'Reflection and truth. What you see reveals what you need to integrate.',
            'door': 'Opportunity and threshold. You stand at the edge of transformation.',
            'key': 'Solution and access. You hold what unlocks your next chapter.',
            'bridge': 'Connection and transition. You are crossing from one state to another.',
            'spiral': 'Evolution and expansion. You move in cycles, but each turn brings growth.',
            'cross': 'Intersection and choice. Where paths meet, you must choose consciously.',
            'circle': 'Wholeness and completion. You are returning to center, to yourself.',
            'triangle': 'Balance and manifestation. Mind, body, spirit align in creation.',

            // Abstract
            'chaos': 'Dissolution and potential. In the breakdown, new forms await creation.',
            'symmetry': 'Balance and harmony. As above, so below; as within, so without.',
            'void': 'Emptiness and possibility. The pregnant pause before creation.',
            'light': 'Consciousness and awareness. Illumination reveals truth.',
            'shadow': 'The unconscious and hidden aspects. What you reject seeks integration.',
            'portal': 'Gateway and transition. You are moving between realms of experience.',
            'energy': 'Life force and vitality. The animating principle flows through you.',
            'labyrinth': 'Journey and self-discovery. The path winds, but the center awaits.',

            // Default
            'default': 'Your perception is unique and valid. What you see reflects your inner landscape, a symbol emerging from your personal mythology. Trust that this vision carries meaning specific to your journey.'
        };

        // Color interpretation system
        const colorMeanings = {
            red: { emotion: 'Passion, vitality, primal energy', energy: 'Active, assertive, life-force' },
            orange: { emotion: 'Creativity, enthusiasm, warmth', energy: 'Dynamic, social, expressive' },
            yellow: { emotion: 'Joy, intellect, optimism', energy: 'Mental clarity, illumination, consciousness' },
            green: { emotion: 'Growth, healing, balance', energy: 'Harmony, renewal, heart-centered' },
            cyan: { emotion: 'Communication, clarity, peace', energy: 'Flowing, expressive, truth-seeking' },
            blue: { emotion: 'Depth, intuition, trust', energy: 'Contemplative, spiritual, visionary' },
            purple: { emotion: 'Mystery, transformation, wisdom', energy: 'Mystical, intuitive, transcendent' },
            pink: { emotion: 'Love, compassion, gentleness', energy: 'Nurturing, tender, heart-opening' }
        };

        function analyzeColor(rgb) {
            const r = parseInt(rgb.match(/\d+/g)[0]);
            const g = parseInt(rgb.match(/\d+/g)[1]);
            const b = parseInt(rgb.match(/\d+/g)[2]);

            let dominantColor = 'blue';

            if (r > g && r > b) {
                if (g > b) dominantColor = 'orange';
                else dominantColor = 'red';
            } else if (g > r && g > b) {
                if (r > b) dominantColor = 'yellow';
                else if (b > r * 0.7) dominantColor = 'cyan';
                else dominantColor = 'green';
            } else if (b > r && b > g) {
                if (r > g) dominantColor = 'purple';
                else dominantColor = 'blue';
            } else if (r > 200 && g > 150 && b > 150) {
                dominantColor = 'pink';
            }

            return colorMeanings[dominantColor];
        }

        // Initialize inkblot
        let inkblot = new Inkblot();

        // Animation loop
        function animate() {
            if (isAnimating) {
                inkblot.update();
                inkblot.draw();
                animationId = requestAnimationFrame(animate);
            }
        }
        animate();

        // New inkblot button
        document.getElementById('new-inkblot-btn').addEventListener('click', () => {
            isAnimating = true;
            inkblot = new Inkblot();
            document.getElementById('prompt-container').classList.remove('show');
            document.getElementById('result-container').classList.remove('show');
            if (!animationId) {
                animate();
            }
        });

        // Click to freeze
        canvas.addEventListener('click', () => {
            if (isAnimating) {
                isAnimating = false;
                cancelAnimationFrame(animationId);
                frozenImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                inkblotState = {
                    color: inkblot.getCurrentColor(),
                    inkblot: inkblot
                };
                document.getElementById('prompt-container').classList.add('show');
                document.getElementById('user-input').value = '';
                document.getElementById('user-input').focus();
            }
        });

        // Submit interpretation
        document.getElementById('submit-btn').addEventListener('click', submitInterpretation);
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitInterpretation();
            }
        });

        function submitInterpretation() {
            const userInput = document.getElementById('user-input').value.trim().toLowerCase();

            if (!userInput) return;

            // Analyze color
            const colorAnalysis = analyzeColor(inkblotState.color);
            const colorReading = `
                <div style="margin-bottom: 15px;">
                    <span class="color-sample" style="background-color: ${inkblotState.color}"></span>
                    <strong>Dominant Hue:</strong> ${inkblotState.color}
                </div>
                <div style="margin-bottom: 10px;">
                    <strong>Emotional Signature:</strong><br>${colorAnalysis.emotion}
                </div>
                <div>
                    <strong>Energetic Quality:</strong><br>${colorAnalysis.energy}
                </div>
            `;

            // Find symbolic interpretation
            let interpretation = oracleDict['default'];

            // Check for exact matches first
            for (let key in oracleDict) {
                if (userInput.includes(key)) {
                    interpretation = oracleDict[key];
                    break;
                }
            }

            const symbolicInterpretation = `
                <div style="margin-bottom: 15px;">
                    <strong>You perceived:</strong> <em>"${document.getElementById('user-input').value.trim()}"</em>
                </div>
                <div style="line-height: 1.8;">
                    ${interpretation}
                </div>
            `;

            // Display results
            document.getElementById('color-reading').innerHTML = colorReading;
            document.getElementById('symbolic-interpretation').innerHTML = symbolicInterpretation;
            document.getElementById('prompt-container').classList.remove('show');
            document.getElementById('result-container').classList.add('show');
        }

        // Close results
        document.getElementById('close-result-btn').addEventListener('click', () => {
            document.getElementById('result-container').classList.remove('show');
            isAnimating = true;
            animate();
        });
    </script>
</body>
</html>
