<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rorschach Inkblot Oracle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="newInkblot" class="new-inkblot-btn">New Inkblot</button>

        <div class="inkblot-container">
            <canvas id="inkblotCanvas"></canvas>
        </div>

        <div id="inputSection" class="input-section hidden">
            <p class="question">What do you see?</p>
            <textarea id="userInput" placeholder="Describe what you see in the inkblot..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
